name: Profil-Grafiken

# Baut alle sechs Stunden die Statistik- und die Aktivitäts-Karte neu und
# legt sie auf den Branch `output`, auf den das README verlinkt.

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Statistik-Karte
        run: node scripts/stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Auf den Branch output veröffentlichen
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Profil-Grafiken aktualisieren
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
